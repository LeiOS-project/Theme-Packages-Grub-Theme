# LeiOS GRUB theme defaults, read by update-grub (grub-mkconfig) after
# /etc/default/grub.
#
# These are only defaults: each variable is set here only if it has not been
# set before, so a setting in /etc/default/grub always takes precedence, e.g.
#
#   GRUB_THEME=/path/to/other/theme.txt   use another theme
#   GRUB_THEME=                           disable the graphical theme
#   GRUB_GFXMODE=auto                     use another resolution
#
# The boot menu background comes from the desktop-grub alternative
# (update-alternatives --config desktop-grub) and is overridden by
# GRUB_BACKGROUND in /etc/default/grub.
#
# Run update-grub after changing any of these settings.

# This file is kept after the package is removed (until purge), so only act
# while the theme is actually installed.
if [ -f /usr/share/grub/themes/leios-theme/theme.txt ]; then
	GRUB_THEME="${GRUB_THEME-/usr/share/grub/themes/leios-theme/theme.txt}"
	GRUB_GFXMODE="${GRUB_GFXMODE-1920x1080,auto}"
fi
